<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="app-header">
  <div class="app-header__inner">
    <a class="app-brand" routerLink="/" aria-label="WebMCP Angular Demo home">
      <span class="app-brand__mark" aria-hidden="true">M</span>
      WebMCP Demo
    </a>
    <nav class="app-nav" aria-label="Primary">
      <ul class="app-nav__list">
        @for (link of links; track link.path) {
          <li>
            <a
              class="app-nav__link"
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
<main id="main-content">
  <router-outlet />
</main>
<footer class="app-footer">
  <div class="app-footer__inner">
    <p class="app-footer__credit">
      Built by
      <a href="https://pawelkubiak.dev" target="_blank" rel="noopener noreferrer">Paweł Kubiak</a>
      · Angular 22 · WebMCP demo
    </p>
    <ul class="app-footer__links" aria-label="Related reading">
      <li>
        <a
          href="https://pawelkubiak.dev/blog/webmcp-teaching-ai-agents-to-interact-with-your-web-app"
          target="_blank"
          rel="noopener noreferrer"
          >WebMCP: teaching AI agents</a
        >
      </li>
      <li>
        <a
          href="https://pawelkubiak.dev/blog/webmcp-in-angular-framework-level-support-for-ai-agents"
          target="_blank"
          rel="noopener noreferrer"
          >WebMCP in Angular</a
        >
      </li>
    </ul>
  </div>
</footer>
